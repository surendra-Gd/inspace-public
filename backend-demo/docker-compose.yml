services:
  postgres:
    container_name: postgres-sql
    image: postgres
    environment:
      POSTGRES_USER: surendra
      POSTGRES_PASSWORD: surendra
      POSTGRES_DB: demo_db
    ports:
      - "5431:5432"
    volumes:
      - postgres:/var/lib/postgres/data
    networks:
      - fs-network
  spring-boot-app:
    container_name: spring-demo
    image: inspace/backend:1.0
    environment:
      DB_USERNAME: surendra
      DB_PASSWORD: surendra
      DB_URL: jdbc:postgresql://postgres-sql:5432/demo_db
    ports:
      - "8081:8080"
    networks:
      - fs-network
    depends_on:
      - postgres
volumes:
  postgres:

networks:
  fs-network:
    driver: bridge